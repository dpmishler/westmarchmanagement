<!doctype html>

<head>

<style>
  @font-face {
    font-family: "Sentient";
    src: url("/fonts/Sentient-Variable.woff2") format("woff2");
    font-weight: 200 700; font-display: swap;
  }
  @font-face {
    font-family: "Switzer";
    src: url("/fonts/Switzer-Variable.woff2") format("woff2");
    font-weight: 100 900; font-display: swap;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    font-family: "Switzer", -apple-system, "Segoe UI", sans-serif;
    background: #F4F2EB; color: #14201A;
    display: grid; place-items: center; min-height: 100svh; padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 40ch; }
  .code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.75rem; letter-spacing: 0.16em; color: #1E5C41;
    border-left: 1px solid #C29237; padding-left: 12px; margin-bottom: 20px;
  }
  h1 {
    font-family: "Sentient", Georgia, serif; font-weight: 420;
    font-size: clamp(1.9rem, 6vw, 2.8rem); line-height: 1.1;
    letter-spacing: -0.015em; margin-bottom: 14px; text-wrap: balance;
  }
  p { color: #4A554D; line-height: 1.6; margin-bottom: 28px; }
  a {
    display: inline-block; text-decoration: none; font-weight: 520;
    padding: 12px 20px; border-radius: 999px; background: #14201A; color: #F4F2EB;
    transition: background 180ms ease;
  }
  a:hover { background: #174A34; }
</style>
</head>
<body>
  <main>
    <p class="code">404 — BEYOND THE SURVEYED AREA</p>

  </main>
</body>
